<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Violet Custom Alert Preview & Test Bench</title>
  <link rel="stylesheet" href="alertbox.css">
  <style>
    body {
      background: radial-gradient(circle at center, #15172A 0%, #090812 100%) !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 40px 20px;
    }

    .test-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      background: rgba(21, 23, 42, 0.85);
      border: 1px solid rgba(140, 99, 216, 0.4);
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .test-btn {
      background: linear-gradient(135deg, #2B1E45, #15172A);
      color: #F2EDFF;
      border: 1px solid #8C63D8;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .test-btn:hover {
      background: #8C63D8;
      color: #090812;
      box-shadow: 0 0 14px rgba(200, 173, 255, 0.5);
      transform: translateY(-2px);
    }

    .preview-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .instructions {
      color: #c8adff;
      font-size: 13px;
      text-align: center;
      max-width: 600px;
      opacity: 0.8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="test-controls">
    <button class="test-btn" onclick="triggerAlert('follow', 'NEW FOLLOWER', 'VioTic', 'just joined!', '')">Test Follower</button>
    <button class="test-btn" onclick="triggerAlert('sub', 'NEW SUBSCRIBER', 'Koyuki', 'subscribed for 6 months!', 'Excited to be here!')">Test Subscriber</button>
    <button class="test-btn" onclick="triggerAlert('tip', 'DONATION', 'MrekkFan99', 'tipped $25.00!', 'Love the stream!', 25)">Test Donation</button>
    <button class="test-btn" onclick="triggerAlert('cheer', 'CHEER', 'PixelPal', 'cheered 500 bits!', 'Hype gameplay! Keep it up!', 500)">Test Bits</button>
    <button class="test-btn" onclick="triggerAlert('raid', 'RAID', 'WhiteCat', 'raided with 1,450 viewers!', '')">Test Raid</button>
  </div>

  <div class="preview-stage" id="stage">
    <!-- Alert widget injects here -->
  </div>

  <div class="instructions">
    Click any button above to trigger a Violet alert preview. This uses the exact HTML &amp; CSS built for your Streamlabs Alert Box. Each type gets its own ring count / accent color via the shared palette — see the Alerts Setup doc.
  </div>

  <script src="alertbox.js"></script>
  <script>
    function triggerAlert(type, category, name, action, message, amount) {
      const stage = document.getElementById('stage');

      // Clean and re-insert HTML to trigger CSS animations cleanly
      fetch('alertbox.html')
        .then(res => res.text())
        .then(html => {
          stage.innerHTML = html;
          showAlert(type, category, name, action, message, amount);
        })
        .catch(err => {
          // Inline fallback if opened via file:// protocol without local server
          stage.innerHTML = `
            <div id="violet-alert-container" class="violet-alert-container" data-type="${type}">
              <div class="alert-rhythm-wrapper">
                <div class="amount-ring"></div>
                <div class="approach-ring"></div>
                <div class="approach-ring delay-1"></div>
                <div class="approach-ring delay-2"></div>
                <div class="alert-card">
                  <div class="alert-header">
                    <span class="rhythm-circle">●</span>
                    <span class="alert-category" id="alert-category">${category}</span>
                    <span class="rhythm-circle">●</span>
                  </div>
                  <div class="alert-body">
                    <div class="alert-title-wrap">
                      <span class="highlight-name" id="alert-user-name">${name}</span>
                      <span class="action-text" id="alert-action-text">${action}</span>
                    </div>
                    <div class="alert-message-wrap" id="alert-message-wrap" style="${message ? 'display:block;' : 'display:none;'}">
                      <p class="alert-user-message" id="alert-user-message">${message}</p>
                    </div>
                  </div>
                  <div class="alert-timing-bar">
                    <div class="timing-fill"></div>
                  </div>
                </div>
              </div>
            </div>
          `;
          const numericAmount = Number(amount) || 0;
          const glow = (type === 'tip' || type === 'cheer') && numericAmount > 0
            ? Math.max(0.15, Math.min(0.55, numericAmount / 100))
            : 0;
          stage.querySelector('#violet-alert-container').style.setProperty('--amount-glow', glow);
        });
    }

    // Trigger initial follower alert on load
    window.addEventListener('DOMContentLoaded', () => {
      triggerAlert('follow', 'NEW FOLLOWER', 'VioTic', 'just joined!', '');
    });
  </script>
</body>
</html>
