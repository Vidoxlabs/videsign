---
name: Design system issue
description: Report a problem with a design token, preview fragment, or guardrail
labels: ["design-system"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the design system is affected?
      options:
        - DESIGN.md tokens
        - Preview fragment
        - MCP server
        - ADR / guardrail
        - Token pipeline (generate-tokens.js)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, missing, or inconsistent? Include the token path or fragment name.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If applicable, how do you trigger the issue?
