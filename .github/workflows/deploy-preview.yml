name: Deploy Component Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens and preview CSS
        run: npm run tokens

      - name: Lint code and preview fragments
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Stage static preview site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dist preview lib brand _site/
          cat <<'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./preview/" />
            <title>Nocturne Museum: visual catalog</title>
          </head>
          <body>
            <p>Redirecting to <a href="./preview/">the videsign component catalog</a>.</p>
            <script>window.location.replace('./preview/');</script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
