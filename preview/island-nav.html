  Ask trigger that links to /ask; Ask is not a seventh nav item. The island is one
  glass layer built as shell + core (vi-glass-shell around vi-glass-core): its text
  must stay at 4.5:1 over bright imagery, which a single translucent layer cannot do.
  Active link uses aria-current and a solid brand-tinted pill.
  The brand accent fills the Ask trigger, which is solid, not glass.
-->
