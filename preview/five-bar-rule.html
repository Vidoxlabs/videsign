<!--
  Nocturne Museum: Five-bar rule (ADR-013)
  Five hard segments, one signature colour each, in canon order: Violet, Wisteria,
  Xylia, Yarrow, Zinnia. Each segment is its own fill, so no gradient joins two
  signature colours, and Xylia never appears alone. Decorative: hidden from
  assistive tech. Shown under a wordmark-sized heading.
-->
<div class="flex flex-col items-center gap-gap-comfortable-default w-layout-width-inspector-base">
  <p class="font-typography-family-sans-base font-typography-weight-semibold-base text-typography-size-2xl-base text-text-content-primary-base">Vidoxlabs</p>
  <div aria-hidden="true" class="flex w-full gap-gap-dense-default">
    <span class="flex-1 h-indicator-fivebar-base rounded-layout-radius-full-base bg-persona-accent-violet-base"></span>
    <span class="flex-1 h-indicator-fivebar-base rounded-layout-radius-full-base bg-persona-accent-wisteria-base"></span>
    <span class="flex-1 h-indicator-fivebar-base rounded-layout-radius-full-base bg-persona-accent-xylia-base"></span>
    <span class="flex-1 h-indicator-fivebar-base rounded-layout-radius-full-base bg-persona-accent-yarrow-base"></span>
    <span class="flex-1 h-indicator-fivebar-base rounded-layout-radius-full-base bg-persona-accent-zinnia-base"></span>
  </div>
</div>
