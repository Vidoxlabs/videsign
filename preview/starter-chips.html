  <button type="button" class="inline-flex items-center h-action-min-default px-inset-operator-default font-typography-family-sans-base text-typography-size-sm-base text-text-content-primary-base border border-border-separator-primary-base hover:border-surface-accent-violet-base rounded-layout-radius-full-base transition-colors duration-transition-duration-fast-base ease-transition-easing-standard-base whitespace-nowrap">Summarize this page</button>
