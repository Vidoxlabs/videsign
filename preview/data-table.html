<!--
  Nocturne Museum: Data Table Component (ADR-007, ADR-020)
  Semantic operator data table with hairline row boundaries, tabular-nums identifiers,
  and non-color-only status indicator pairs (dot + explicit text label) over grounded fixture rows.
-->

      <tr>

        <th scope="col">Status</th>
        <th scope="col">Target</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="tabular-nums">run_01j8k2</td>

          <span class="vi-data-table-status">
            <span aria-hidden="true" class="shrink-0 w-indicator-dot-base h-indicator-dot-base rounded-layout-radius-full-base bg-status-indicator-success-base"></span>
            <span>Complete</span>
          </span>
        </td>
        <td class="vi-data-table-target">videsign.tokens.emit</td>
      </tr>
      <tr>
        <td class="tabular-nums">run_01j8k3</td>

          </span>

      <tr>
