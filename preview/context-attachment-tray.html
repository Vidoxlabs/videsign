<!--
  Nocturne Museum: Context attachment tray (ADR-016, ADR-020)
  Solid composer-adjacent tray surfacing pinned files, explicitly recalled notes, and
  URL references admitted to the next turn. Distinguishes user-attached items from
  consented memory recall, reports tabular-nums token budget, and provides 44px Remove
  and Clear controls. Never glass.
-->
<section aria-labelledby="ctx-tray-title" class="bg-surface-background-secondary-base border border-border-separator-primary-base rounded-layout-radius-standard-base p-layout-padding-medium-base flex flex-col gap-gap-comfortable-default">
  <div class="flex flex-wrap items-center justify-between gap-gap-compact-default">
    <div class="flex flex-wrap items-center gap-gap-compact-default">
      <h2 id="ctx-tray-title" class="font-typography-family-mono-base text-typography-size-xs-base tracking-typography-tracking-wide-base text-text-content-secondary-base text-balance">Turn context · 3 items admitted</h2>
      <span aria-live="polite" class="inline-flex items-center gap-gap-compact-default px-inset-compact-default py-rhythm-1-base rounded-layout-radius-full-base border border-border-separator-primary-base bg-surface-background-tertiary-base font-typography-family-mono-base text-typography-size-xs-base tabular-nums text-text-content-primary-base">
        <span aria-hidden="true" class="shrink-0 w-indicator-dot-base h-indicator-dot-base rounded-layout-radius-full-base bg-status-indicator-info-base"></span>
        <span>1,420 / 8,000 tokens</span>
      </span>
    </div>
    <button type="button" class="inline-flex items-center h-action-min-default px-inset-operator-default rounded-layout-radius-control-base border border-border-separator-primary-base bg-surface-background-tertiary-base font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base hover:text-text-content-primary-base hover:border-surface-accent-violet-base transition-colors duration-transition-duration-fast-base ease-transition-easing-standard-base whitespace-nowrap">Clear all</button>
  </div>
  <ul aria-label="Pinned context items" class="flex flex-wrap gap-gap-compact-default">
    <li class="inline-flex items-center gap-gap-compact-default pl-inset-operator-default pr-rhythm-1-base rounded-layout-radius-control-base border border-border-separator-primary-base bg-surface-background-primary-base">
      <span aria-hidden="true" class="shrink-0 w-indicator-dot-base h-indicator-dot-base rounded-layout-radius-full-base bg-border-graph-line-base"></span>
      <span class="font-typography-family-mono-base text-typography-size-xs-base text-text-content-primary-base">DESIGN.md</span>
      <span class="font-typography-family-mono-base text-typography-size-xs-base tabular-nums text-text-content-secondary-base">file · 940 tok</span>
      <button type="button" aria-label="Remove DESIGN.md from turn context" class="inline-flex items-center justify-center h-action-min-default px-inset-compact-default rounded-layout-radius-control-base font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base hover:text-text-content-primary-base transition-colors duration-transition-duration-fast-base ease-transition-easing-standard-base whitespace-nowrap">Remove</button>
    </li>
    <li class="inline-flex items-center gap-gap-compact-default pl-inset-operator-default pr-rhythm-1-base rounded-layout-radius-control-base border border-surface-accent-violet-base bg-surface-background-primary-base">
      <span aria-hidden="true" class="shrink-0 w-indicator-dot-base h-indicator-dot-base rounded-layout-radius-full-base bg-status-indicator-info-base"></span>
      <span class="font-typography-family-mono-base text-typography-size-xs-base text-text-content-primary-base">Tailwind v3 pin</span>
      <span class="font-typography-family-mono-base text-typography-size-xs-base tabular-nums text-text-content-secondary-base">recalled note · 260 tok</span>
      <button type="button" aria-label="Remove recalled note Tailwind v3 pin from turn context" class="inline-flex items-center justify-center h-action-min-default px-inset-compact-default rounded-layout-radius-control-base font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base hover:text-text-content-primary-base transition-colors duration-transition-duration-fast-base ease-transition-easing-standard-base whitespace-nowrap">Remove</button>
    </li>
    <li class="inline-flex items-center gap-gap-compact-default pl-inset-operator-default pr-rhythm-1-base rounded-layout-radius-control-base border border-border-separator-primary-base bg-surface-background-primary-base">
      <span aria-hidden="true" class="shrink-0 w-indicator-dot-base h-indicator-dot-base rounded-layout-radius-full-base bg-status-indicator-success-base"></span>
      <span class="font-typography-family-mono-base text-typography-size-xs-base text-text-content-primary-base">preview/index.html#L140-L185</span>
      <span class="font-typography-family-mono-base text-typography-size-xs-base tabular-nums text-text-content-secondary-base">selection · 220 tok</span>
      <button type="button" aria-label="Remove selection preview/index.html from turn context" class="inline-flex items-center justify-center h-action-min-default px-inset-compact-default rounded-layout-radius-control-base font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base hover:text-text-content-primary-base transition-colors duration-transition-duration-fast-base ease-transition-easing-standard-base whitespace-nowrap">Remove</button>
    </li>
  </ul>
  <p class="font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base">Only items listed above enter the provider request; forgotten notes stay withheld.</p>
</section>
