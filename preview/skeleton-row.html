<!--
  Nocturne Museum: Skeleton row
  Loading geometry in the tertiary surface, matched to the resolved row so data arrival
  causes zero layout shift (DESIGN.md fail-closed states). Static on purpose: no shimmer,
  no animation. Announced once as a status; the blocks are hidden from assistive tech.
-->
<div role="status" class="flex items-center gap-gap-comfortable-default h-action-wide-default p-inset-operator-default border-b border-border-separator-primary-base">
  <span class="sr-only">Loading</span>
  <span aria-hidden="true" class="shrink-0 w-icon-sm-base h-icon-sm-base rounded-layout-radius-full-base bg-surface-background-tertiary-base"></span>
  <span aria-hidden="true" class="flex-1 h-icon-xs-base rounded-layout-radius-control-base bg-surface-background-tertiary-base"></span>
  <span aria-hidden="true" class="shrink-0 w-layout-width-sidebar-base h-icon-xs-base rounded-layout-radius-control-base bg-surface-background-tertiary-base"></span>
</div>
