<!--
  Nocturne Museum: Receipt ledger row (ADR-017, ADR-020)
  Hairline-separated receipt ledger rows in a polite live region: a mono micro-label
  paired with a tabular mono value. Uses neutral fixture text with no claim of
  verification or action authority.
-->
<div class="vi-specimen-cq max-w-2xl">
  <dl aria-live="polite" aria-label="Receipt" class="vi-ledger border-t border-border-separator-primary-base">
    <div class="vi-ledger-row">
      <dt class="font-typography-family-mono-base text-typography-size-xs-base tracking-typography-tracking-wide-base text-text-content-secondary-base">Handoff</dt>
      <dd class="font-typography-family-mono-base text-typography-size-sm-base tabular-nums text-text-content-primary-base">CA → SA</dd>
    </div>
    <div class="vi-ledger-row">
      <dt class="font-typography-family-mono-base text-typography-size-xs-base tracking-typography-tracking-wide-base text-text-content-secondary-base">Usage</dt>
      <dd class="font-typography-family-mono-base text-typography-size-sm-base tabular-nums text-text-content-primary-base">14,280 / 50,000 tokens</dd>
    </div>
    <div class="vi-ledger-row">
      <dt class="font-typography-family-mono-base text-typography-size-xs-base tracking-typography-tracking-wide-base text-text-content-secondary-base">Gate state</dt>
      <dd class="font-typography-family-mono-base text-typography-size-sm-base tabular-nums text-text-content-primary-base">ratify_absent</dd>
    </div>
  </dl>
</div>
