-->
<div class="flex items-center gap-3 p-layout-padding-medium-base mb-5 rounded-layout-radius-control-base bg-status-indicator-warning-base/10 border border-status-indicator-warning-base/20">
  <span class="w-2 h-2 rounded-full bg-status-indicator-warning-base shadow-sm shrink-0"></span>
  <div class="flex-1 flex items-center gap-3">
    <span class="font-typography-family-mono-base text-sm text-status-indicator-warning-base">
      1 monitor degraded — openwebui.bridge
    </span>
    <span class="font-typography-family-sans-base text-xs text-text-content-secondary-base">
      p99 = 840ms
    </span>
  </div>
  <button type="button" class="bg-transparent text-text-content-secondary-base hover:text-text-content-primary-base text-sm font-typography-family-sans-base transition-colors duration-200">
    Inspect
  </button>
</div>
