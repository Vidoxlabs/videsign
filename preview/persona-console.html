<!--
  Nocturne Museum: Sovereign Persona Console
  Standard frame for presenting a sovereign persona: identity status header,
  primary operational viewport, evidence trail panel, and command bar.
  Demonstrated with persona Violet. Identity accents are locked per DESIGN.md
  (persona identity only, never a status indicator); see SKILL.md ADR-004.
  Persona accent TEXT sits on the primary surface only: Violet #8B5CF6 measures
  4.67:1 on primary but 4.40:1 on secondary, so the viewport and evidence panel
  carry no accent text. The accent appears there as a non-text indicator (dot, bar).
  Evidence slots are empty by design: each states "Unavailable" until a pinned record
  is attached. Nothing here claims verification or action authority.
-->
<section class="w-full bg-surface-background-primary-base border border-border-separator-primary-base rounded-layout-radius-standard-base flex flex-col overflow-hidden">
  <!-- Identity status header (mono per typography family rules), on the primary surface -->
  <header class="flex items-center justify-between p-layout-padding-medium-base border-b border-border-separator-primary-base border-l-4 border-l-persona-accent-violet-base">
    <div class="flex flex-col gap-gap-dense-default min-w-0">
      <span class="font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base">Sovereign persona console</span>
      <h2 class="font-typography-family-sans-base text-typography-size-lg-base font-bold text-text-content-primary-base leading-none">Violet</h2>
    </div>
    <!-- Persona micro-badge: identity accent, never a status indicator -->
    <span class="shrink-0 inline-flex items-center gap-gap-compact-default font-typography-family-mono-base text-typography-size-xs-base text-persona-accent-violet-base border border-border-separator-primary-base rounded-layout-radius-control-base px-inset-operator-default py-inset-compact-default">
      <span aria-hidden="true" class="w-2 h-2 rounded-layout-radius-full-base bg-persona-accent-violet-base"></span>persona: violet
    </span>
  </header>

  <!-- Primary operational viewport (morphs per persona; frame stays mounted) -->
  <div class="flex-1 min-w-0 p-layout-padding-medium-base bg-surface-background-secondary-base overflow-y-auto">
    <p class="font-typography-family-sans-base text-typography-size-md-base text-text-content-primary-base">
      Operational viewport. The addressed persona's working surface morphs here
      while the shared console frame stays mounted, with zero layout shift.
    </p>
  </div>

  <!-- Evidence trail panel: slots with an explicit unavailable state -->
  <aside aria-label="Evidence trail" class="p-layout-padding-medium-base border-t border-border-separator-primary-base flex flex-col gap-gap-compact-default">
    <span class="font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base">Evidence trail</span>
    <ul class="flex flex-col gap-gap-dense-default">
      <li class="flex items-center justify-between gap-gap-comfortable-default font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base"><span>Profile digest</span><span data-state="unavailable">Unavailable</span></li>
      <li class="flex items-center justify-between gap-gap-comfortable-default font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base"><span>Intent policy</span><span data-state="unavailable">Unavailable</span></li>
      <li class="flex items-center justify-between gap-gap-comfortable-default font-typography-family-mono-base text-typography-size-xs-base text-text-content-secondary-base"><span>Forget proof</span><span data-state="unavailable">Unavailable</span></li>
    </ul>
  </aside>

  <!-- Command bar (44px touch targets per action-min-default) -->
  <footer class="flex items-center gap-gap-compact-default p-layout-padding-medium-base border-t border-border-separator-primary-base">
    <button type="button" class="h-action-min-default bg-surface-accent-violet-base hover:bg-surface-accent-violet-hover active:bg-surface-accent-violet-active text-text-content-primary-base rounded-layout-radius-control-base px-layout-padding-large-base font-typography-family-sans-base text-typography-size-sm-base transition-colors duration-transition-duration-normal-base">
      Open trace
    </button>
    <button type="button" class="h-action-min-default bg-surface-background-tertiary-base text-text-content-secondary-base border border-border-separator-primary-base rounded-layout-radius-control-base px-layout-padding-large-base font-typography-family-sans-base text-typography-size-sm-base transition-colors duration-transition-duration-normal-base">
      Inspect evidence
    </button>
  </footer>
</section>
