<!--
  Nocturne Museum: Visual Catalog
  Renders every preview/ fragment with the generated stylesheets so each one is styled for real.

  Run `npm run tokens` first (it writes dist/), then serve the repository root over HTTP and
  open /preview/ (fragments load with fetch(), which browsers block on file://):
    python3 -m http.server 8000
  Geist and Geist Mono are not bundled here (ADR-007: binaries live in the consuming site).
  The catalog uses them if installed and otherwise falls back to the system stack.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="paused">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nocturne Museum: visual catalog</title>
  <link rel="stylesheet" href="../dist/tokens.css" />
  <link rel="stylesheet" href="../dist/themes.css" />
  <link rel="stylesheet" href="../dist/catalog.css" />
  <link rel="stylesheet" href="../dist/glass.css" />
  <link rel="stylesheet" href="../dist/stage.css" />
  <link rel="stylesheet" href="../dist/dialects.css" />
  <link rel="stylesheet" href="../dist/memory-field.css" />
  <link rel="stylesheet" href="../dist/vi-orbital-hero.css" />
  <link rel="stylesheet" href="../dist/docs-portal.css" />
  <link rel="stylesheet" href="../dist/settings-surface.css" />
  <link rel="stylesheet" href="../dist/library-surface.css" />
  <script type="module" src="../dist/vi-orbital-field.js"></script>
  <script defer src="../dist/docs-portal.js"></script>
  <script defer src="../dist/settings-surface.js"></script>
  <script defer src="../dist/library-surface.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: clip;
      background: var(--vi-colors-surface-background-primary-base);
      color: var(--vi-colors-text-content-primary-base);
      font-family: var(--vi-typography-typography-family-sans-base);
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
    }
    .skip-link:focus {
      display: inline-flex;
      align-items: center;
      min-height: var(--vi-size-action-min-default);
      left: var(--vi-spacing-layout-padding-large-base);
      top: var(--vi-spacing-layout-padding-medium-base);
      z-index: 40;
      padding: 0 var(--vi-spacing-layout-padding-medium-base);
      background: var(--vi-colors-surface-background-secondary-base);
      color: var(--vi-colors-text-content-primary-base);
      border: 1px solid var(--vi-colors-surface-accent-violet-base);
      border-radius: var(--vi-spacing-layout-radius-control-base);
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-sm-base);
      text-decoration: none;
    }

    .catalog-shell {
      display: flex;
      align-items: flex-start;
      min-height: 100dvh;
      background: var(--vi-colors-surface-background-primary-base);
    }

    .catalog-sidebar {
      width: 280px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100dvh;
      max-height: 100dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: var(--vi-spacing-layout-padding-medium-base);
      padding: var(--vi-spacing-layout-padding-large-base) var(--vi-spacing-layout-padding-medium-base);
      background: var(--vi-colors-surface-background-secondary-base);
      border-right: 1px solid var(--vi-colors-border-separator-primary-base);
    }

    .catalog-brand {
      display: flex;
      align-items: center;
      gap: var(--vi-space-gap-comfortable-default);
    }
    .catalog-brand img {
      width: var(--vi-size-icon-sm-base);
      height: var(--vi-size-icon-sm-base);
      flex-shrink: 0;
    }
    .catalog-brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .catalog-brand-text h1 {
      margin: 0;
      font-size: var(--vi-typography-typography-size-lg-base);
      font-weight: var(--vi-typography-typography-weight-semibold-base);
      letter-spacing: var(--vi-typography-typography-tracking-tight-base);
      line-height: var(--vi-typography-typography-leading-tight-base);
      color: var(--vi-colors-text-content-primary-base);
    }
    .catalog-brand-sub {
      margin: 0;
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      color: var(--vi-colors-text-content-secondary-base);
    }

    .search-box {
      display: flex;
      align-items: center;
      min-height: var(--vi-size-action-min-default);
      padding: 0 var(--vi-space-gap-comfortable-default);
      background: var(--vi-colors-surface-background-primary-base);
      border: 1px solid var(--vi-colors-border-separator-primary-base);
      border-radius: var(--vi-spacing-layout-radius-control-base);
      transition: border-color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base);
    }
    .search-box:focus-within {
      border-color: var(--vi-colors-surface-accent-violet-base);
    }
    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--vi-colors-text-content-primary-base);
      font-family: var(--vi-typography-typography-family-sans-base);
      font-size: var(--vi-typography-typography-size-sm-base);
    }
    .search-box input::placeholder {
      color: var(--vi-colors-text-content-secondary-base);
    }

    .tier-filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--vi-space-gap-compact-default);
    }
    .ctl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--vi-space-gap-compact-default);
      min-height: var(--vi-size-action-min-default);
      padding: 0 var(--vi-space-gap-comfortable-default);
      background: var(--vi-colors-surface-background-primary-base);
      color: var(--vi-colors-text-content-secondary-base);
      border: 1px solid var(--vi-colors-border-separator-primary-base);
      border-radius: var(--vi-spacing-layout-radius-control-base);
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      transition: border-color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base),
        color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base),
        background-color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base);
    }
    .ctl-btn:hover {
      border-color: var(--vi-colors-text-content-secondary-base);
      color: var(--vi-colors-text-content-primary-base);
    }
    .ctl-btn:focus-visible {
      outline: 2px solid var(--vi-colors-surface-accent-violet-base);
      outline-offset: 2px;
    }
    .ctl-btn[aria-pressed="true"] {
      background: var(--vi-colors-surface-background-tertiary-base);
      border-color: var(--vi-colors-surface-accent-violet-base);
      color: var(--vi-colors-text-content-primary-base);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: var(--vi-space-gap-compact-default);
    }
    .sidebar-group {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--vi-colors-border-separator-primary-base);
      padding-bottom: var(--vi-space-gap-compact-default);
    }
    .sidebar-group:last-child {
      border-bottom: 0;
    }
    .sidebar-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--vi-size-action-min-default);
      padding: 0 var(--vi-space-gap-compact-default);
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      color: var(--vi-colors-text-content-secondary-base);
      cursor: pointer;
      list-style: none;
      border-radius: var(--vi-spacing-layout-radius-control-base);
      transition: color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base),
        background-color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base);
    }
    .sidebar-group-head::-webkit-details-marker { display: none; }
    .sidebar-group-head:hover {
      color: var(--vi-colors-text-content-primary-base);
      background: var(--vi-colors-surface-background-tertiary-base);
    }
    .sidebar-group-head:focus-visible {
      outline: 2px solid var(--vi-colors-surface-accent-violet-base);
      outline-offset: -2px;
    }
    .sidebar-group-meta {
      display: inline-flex;
      align-items: center;
      gap: var(--vi-space-gap-compact-default);
    }
    .sidebar-chevron {
      display: inline-block;
      transition: transform var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base);
    }
    .sidebar-group[open] .sidebar-chevron {
      transform: rotate(90deg);
    }
    .sidebar-group-links {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 2px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--vi-space-gap-compact-default);
      min-height: var(--vi-size-action-min-default);
      padding: 0 var(--vi-space-gap-compact-default);
      border-radius: var(--vi-spacing-layout-radius-control-base);
      color: var(--vi-colors-text-content-secondary-base);
      font-size: var(--vi-typography-typography-size-sm-base);
      text-decoration: none;
      transition: background-color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base),
        color var(--vi-transition-transition-duration-fast-base) var(--vi-transition-transition-easing-standard-base);
    }
    .sidebar-link:hover {
      background: var(--vi-colors-surface-background-tertiary-base);
      color: var(--vi-colors-text-content-primary-base);
    }
    .sidebar-link:focus-visible {
      outline: 2px solid var(--vi-colors-surface-accent-violet-base);
      outline-offset: -2px;
    }
    .sidebar-link span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count-num {
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      font-variant-numeric: tabular-nums;
      color: var(--vi-colors-text-content-secondary-base);
    }

    .catalog-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .catalog-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--vi-space-gap-comfortable-default);
      padding: var(--vi-spacing-layout-padding-medium-base) var(--vi-spacing-layout-padding-large-base);
      background: var(--vi-colors-surface-background-primary-base);
      border-bottom: 1px solid var(--vi-colors-border-separator-primary-base);
    }
    .toolbar-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--vi-space-gap-comfortable-default);
    }
    .toolbar-status {
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      font-variant-numeric: tabular-nums;
      color: var(--vi-colors-text-content-secondary-base);
    }
    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--vi-space-gap-compact-default);
    }

    .catalog-content {
      width: 100%;
      max-width: 1120px;
      padding: var(--vi-spacing-layout-padding-large-base);
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .tier-section {
      display: flex;
      flex-direction: column;
      gap: var(--vi-spacing-layout-padding-large-base);
      scroll-margin-top: 84px;
    }
    .tier-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--vi-space-gap-compact-default);
      padding-bottom: var(--vi-space-gap-comfortable-default);
      border-bottom: 1px solid var(--vi-colors-border-separator-primary-base);
    }
    .tier-header h2 {
      margin: 0;
      font-size: var(--vi-typography-typography-size-2xl-base);
      font-weight: var(--vi-typography-typography-weight-semibold-base);
      letter-spacing: var(--vi-typography-typography-tracking-tight-base);
      color: var(--vi-colors-text-content-primary-base);
    }
    .tier-summary {
      margin: 4px 0 0;
      font-size: var(--vi-typography-typography-size-sm-base);
      color: var(--vi-colors-text-content-secondary-base);
      max-width: 65ch;
    }

    .specimen-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .fragment-section {
      display: flex;
      flex-direction: column;
      background: var(--vi-colors-surface-background-secondary-base);
      border: 1px solid var(--vi-colors-border-separator-primary-base);
      border-radius: var(--vi-spacing-layout-radius-standard-base);
      overflow: hidden;
      scroll-margin-top: 84px;
    }
    .specimen-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--vi-space-gap-comfortable-default);
      padding: var(--vi-spacing-layout-padding-medium-base) var(--vi-spacing-layout-padding-large-base);
      border-bottom: 1px solid var(--vi-colors-border-separator-primary-base);
    }
    .specimen-titles {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .specimen-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--vi-space-gap-compact-default);
    }
    .fragment-label {
      margin: 0;
      font-size: var(--vi-typography-typography-size-md-base);
      font-weight: var(--vi-typography-typography-weight-semibold-base);
      color: var(--vi-colors-text-content-primary-base);
    }
    .fragment-label a {
      color: inherit;
      text-decoration: none;
    }
    .fragment-label a:hover {
      text-decoration: underline;
    }
    .fragment-file {
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      color: var(--vi-colors-text-content-secondary-base);
      padding: 2px 8px;
      background: var(--vi-colors-surface-background-primary-base);
      border: 1px solid var(--vi-colors-border-separator-primary-base);
      border-radius: var(--vi-spacing-layout-radius-control-base);
    }
    .fragment-note {
      font-family: var(--vi-typography-typography-family-mono-base);
      font-size: var(--vi-typography-typography-size-xs-base);
      color: var(--vi-colors-status-indicator-warning-base);
    }
    .fragment-desc {
      margin: 0;
      font-size: var(--vi-typography-typography-size-sm-base);
      line-height: var(--vi-typography-typography-leading-normal-base);
      color: var(--vi-colors-text-content-secondary-base);
      max-width: 68ch;
    }
    .specimen-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--vi-space-gap-compact-default);
    }

    /* Specimen stage floor: flush inset band strictly contained inside its specimen card. */
    .fragment-frame {
      position: relative;
      isolation: isolate;
      contain: layout style;
      border: 0;
      border-radius: 0;
      padding: var(--vi-spacing-layout-padding-large-base);
      background: var(--vi-colors-surface-background-primary-base);
      overflow-x: auto;
      overflow-y: hidden;
    }
    .fragment-frame > [class*="fixed"] {
      position: static;
      transform: none;
    }

    /* Clean architectural dot floor for crystal-glass controls; no overlapping text or neon wash. */
    .fragment-frame.glass-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
      padding: 32px 24px;
      background-color: var(--vi-colors-surface-background-primary-base);
      background-image: radial-gradient(var(--vi-colors-border-separator-primary-base) 1px, transparent 1px);
      background-size: var(--vi-spacing-layout-padding-large-base) var(--vi-spacing-layout-padding-large-base);
    }
    .fragment-frame.glass-stage > * {
      max-width: 100%;
    }
    body.show-glass-tint .fragment-frame.glass-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 60%, var(--vi-effects-ambient-glow-violet-base), transparent 46%),
        radial-gradient(circle at 86% 80%, var(--vi-effects-ambient-glow-teal-base), transparent 44%);
    }

    /* Bounded specimen wrapper for stage-backdrop.html so the SVG never bleeds beyond its card. */
    .fragment-frame.stage-specimen {
      padding: 0;
      height: 360px;
      overflow: hidden;
      background: var(--vi-colors-surface-background-primary-base);
    }
    .fragment-frame.stage-specimen > div {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Lazy-loaded iframe host with selectable 1440px / 1024px / 390px viewport widths. */
    .fragment-frame.layout-frame {
      padding: 0;
      display: flex;
      justify-content: center;
      background: var(--vi-colors-surface-background-primary-base);
    }
    .layout-viewport {
      width: 100%;
      height: 640px;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      background: var(--vi-colors-surface-background-primary-base);
      transition: width var(--vi-transition-transition-duration-normal-base) var(--vi-transition-transition-easing-standard-base);
    }
    .layout-viewport[data-width="1024"] {
      width: min(100%, 1024px);
      border-left: 1px solid var(--vi-colors-border-separator-primary-base);
      border-right: 1px solid var(--vi-colors-border-separator-primary-base);
    }
    .layout-viewport[data-width="390"] {
      width: min(100%, 390px);
      border-left: 1px solid var(--vi-colors-border-separator-primary-base);
      border-right: 1px solid var(--vi-colors-border-separator-primary-base);
    }
    .layout-viewport iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      transform-origin: top left;
    }

    .legacy-drawer {
      border: 1px solid var(--vi-colors-border-separator-primary-base);
      border-radius: var(--vi-spacing-layout-radius-standard-base);
      background: var(--vi-colors-surface-background-secondary-base);
      padding: var(--vi-spacing-layout-padding-medium-base) var(--vi-spacing-layout-padding-large-base);
    }
    .legacy-drawer > summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--vi-space-gap-comfortable-default);
      min-height: var(--vi-size-action-min-default);
      cursor: pointer;
      list-style: none;
    }
    .legacy-drawer > summary::-webkit-details-marker { display: none; }
    .legacy-drawer[open] > summary {
      padding-bottom: var(--vi-spacing-layout-padding-medium-base);
      margin-bottom: var(--vi-spacing-layout-padding-large-base);
      border-bottom: 1px solid var(--vi-colors-border-separator-primary-base);
    }

    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--vi-space-gap-comfortable-default);
      padding: 48px 24px;
      text-align: center;
      border: 1px dashed var(--vi-colors-border-separator-primary-base);
      border-radius: var(--vi-spacing-layout-radius-standard-base);
      background: var(--vi-colors-surface-background-secondary-base);
    }
    .empty-state.visible { display: flex; }

    .mobile-nav-wrap {
      display: none;
      border-bottom: 1px solid var(--vi-colors-border-separator-primary-base);
      background: var(--vi-colors-surface-background-secondary-base);
      padding: var(--vi-spacing-layout-padding-medium-base);
    }
    .mobile-nav-body {
      margin-top: var(--vi-space-gap-comfortable-default);
      display: flex;
      flex-direction: column;
      gap: var(--vi-space-gap-comfortable-default);
    }
    .legacy-heading {
      margin: 0;
      font-size: var(--vi-typography-typography-size-xl-base);
      font-weight: var(--vi-typography-typography-weight-semibold-base);
      color: var(--vi-colors-text-content-primary-base);
    }

    .hidden-item { display: none !important; }

    @media (max-width: 960px) {
      .catalog-shell { flex-direction: column; }
      .catalog-sidebar { display: none; }
      .mobile-nav-wrap { display: block; }
      .catalog-toolbar,
      .catalog-content { padding: var(--vi-spacing-layout-padding-medium-base); }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#catalog-sections">Skip to catalog sections</a>

  <div class="catalog-shell">
    <aside class="catalog-sidebar" aria-label="Catalog navigation">
      <header class="catalog-brand">
        <img src="../brand/brand_mark_header_v008.svg" alt="Vidoxlabs" />
        <div class="catalog-brand-text">
          <h1>Nocturne Museum</h1>
          <p class="catalog-brand-sub" id="sidebar-total">Visual catalog</p>
        </div>
      </header>

      <div class="search-box">
        <label for="catalog-search" class="sr-only">Filter components by name or filename</label>
        <input id="catalog-search" type="search" autocomplete="off" placeholder="Search components or files" />
      </div>

      <div class="tier-filters" role="group" aria-label="Filter by tier" id="tier-filter-bar"></div>

      <nav class="sidebar-nav" aria-label="Component index" id="sidebar-index"></nav>
    </aside>

    <div class="catalog-main">
      <div class="mobile-nav-wrap">
        <details id="mobile-nav-drawer">
          <summary class="ctl-btn">Browse catalog index</summary>
          <div class="mobile-nav-body">
            <div class="search-box">
              <label for="mobile-search" class="sr-only">Filter components</label>
              <input id="mobile-search" type="search" autocomplete="off" placeholder="Search components or files" />
            </div>
            <div class="tier-filters" id="mobile-tier-bar"></div>
          </div>
        </details>
      </div>

      <div class="catalog-toolbar" role="region" aria-label="Catalog display controls">
        <div class="toolbar-meta">
          <span class="toolbar-status" id="catalog-count" aria-live="polite">Loading catalog...</span>
          <a class="ctl-btn" href="../dist/standard.json">standard.json</a>
        </div>
        <div class="toolbar-actions">

        '<link rel="stylesheet" href="../dist/memory-field.css">' +
        '<link rel="stylesheet" href="../dist/vi-orbital-hero.css">' +
        '<link rel="stylesheet" href="../dist/docs-portal.css">' +
        '<link rel="stylesheet" href="../dist/settings-surface.css">' +
        '<link rel="stylesheet" href="../dist/library-surface.css">' +
        '<script type="module" src="../dist/vi-orbital-field.js"></scr' + 'ipt>' +
        '<script defer src="../dist/docs-portal.js"></scr' + 'ipt>' +
        '<script defer src="../dist/settings-surface.js"></scr' + 'ipt>' +
        '<script defer src="../dist/library-surface.js"></scr' + 'ipt>' +
        '<style>body{margin:0;min-height:100dvh;background:var(--vi-colors-surface-background-primary-base);color:var(--vi-colors-text-content-primary-base);font-family:var(--vi-typography-typography-family-sans-base)}</style>' +
        '</head><body>' + html + '</body></html>';
    }

    function normalizeSpecimenHeadings(container) {
      container.querySelectorAll('h1, h2, h3, h4').forEach(function (heading) {
        var div = document.createElement('div');
        div.setAttribute('role', 'presentation');
        for (var i = 0; i < heading.attributes.length; i += 1) {
          var attr = heading.attributes[i];
          if (attr.name !== 'role') div.setAttribute(attr.name, attr.value);
        }
        while (heading.firstChild) div.appendChild(heading.firstChild);
        heading.replaceWith(div);
      });
    }

    function resolveAssets(raw) {
      return raw
        .replace(/\{ASSET_BASE\}\/vi\/([^/]+)\/chibi\//g, '../assets/quarantine/run_20261103-snap/')
        .replace(/\{ASSET_BASE\}/g, '..');
    }

    function applyViewportScale(viewport) {
      if (!viewport) return;
      var iframe = viewport.querySelector('iframe');
      if (!iframe) return;
      var targetW = Number(viewport.dataset.width || '1440');
      var availW = viewport.clientWidth || targetW;
      var availH = viewport.clientHeight || 640;
      var scale = availW < targetW ? availW / targetW : 1;
      iframe.style.width = targetW + 'px';
      iframe.style.height = Math.round(availH / scale) + 'px';
      iframe.style.transform = scale < 1 ? 'scale(' + scale.toFixed(4) + ')' : '';
    }

    var viewportResizeObserver = 'ResizeObserver' in window
      ? new ResizeObserver(function (entries) {
          entries.forEach(function (entry) { applyViewportScale(entry.target); });
        })
      : null;

    function loadFragment(record) {
      if (record.loaded) return;
      record.loaded = true;
      var f = record.meta;
      fetch(f.file)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (raw) {
          var html = resolveAssets(raw);
          fragmentHtmlCache[f.file] = html;
          if (f.frame) {
            var iframe = document.createElement('iframe');
            iframe.title = f.label;
            iframe.loading = 'lazy';
            iframe.srcdoc = framedDocument(html);
            record.viewport.innerHTML = '';
            record.viewport.appendChild(iframe);
            mountedIframes.push(iframe);
            applyViewportScale(record.viewport);
            if (viewportResizeObserver) viewportResizeObserver.observe(record.viewport);
            if (record.openLink) {
              var blob = new Blob([framedDocument(html)], { type: 'text/html' });
              record.openLink.href = URL.createObjectURL(blob);
            }
          } else {
            record.frame.innerHTML = html;
            normalizeSpecimenHeadings(record.frame);
            if (window.ViDocsPortal && typeof window.ViDocsPortal.initDocsPortal === 'function') {
              window.ViDocsPortal.initDocsPortal(record.frame);
            }
            if (window.ViSettingsSurface && typeof window.ViSettingsSurface.initSettingsSurface === 'function') {
              window.ViSettingsSurface.initSettingsSurface(record.frame);
            }
            if (window.ViLibrarySurface && typeof window.ViLibrarySurface.initLibrarySurface === 'function') {
              window.ViLibrarySurface.initLibrarySurface(record.frame);
            }
            record.frame.querySelectorAll('img[data-chibi-fallback]').forEach(function (img) {
              img.addEventListener('error', function () {
                img.classList.add('hidden');
              }, { once: true });
            });
          }
        })
        .catch(function () {
          var target = f.frame ? record.viewport : record.frame;
          target.textContent = 'Could not load ' + f.file;
        });
    }

    function syncIframes() {
      mountedIframes.forEach(function (iframe) {
        try {
          var doc = iframe.contentDocument;
          if (!doc || !doc.documentElement) return;
          doc.documentElement.setAttribute('data-theme', state.theme);
          doc.documentElement.setAttribute('data-motion', state.motionPaused ? 'paused' : 'running');
        } catch (err) {
          void err;
        }
      });
    }

    var observer = 'IntersectionObserver' in window
      ? new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var rec = entry.target._record;
            if (rec) {
              loadFragment(rec);
              observer.unobserve(entry.target);
            }
          });
        }, { rootMargin: '240px 0px' })
      : null;

    var mainHost = document.getElementById('catalog-sections');
    var emptyState = document.getElementById('empty-state');
    var sidebarIndex = document.getElementById('sidebar-index');
    var tierFilterBar = document.getElementById('tier-filter-bar');
    var mobileTierBar = document.getElementById('mobile-tier-bar');
    var countEl = document.getElementById('catalog-count');
    var sidebarTotal = document.getElementById('sidebar-total');

    sidebarTotal.textContent = FRAGMENTS.length + ' verified specimens';

    function makeTierButton(tierId, label) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ctl-btn';
      btn.dataset.tier = tierId;
      btn.setAttribute('aria-pressed', tierId === state.tier ? 'true' : 'false');
      btn.textContent = label;
      btn.addEventListener('click', function () {
        state.tier = tierId;
        applyFilters();
      });
      return btn;
    }

    [tierFilterBar, mobileTierBar].forEach(function (bar) {
      bar.appendChild(makeTierButton('all', 'All'));
      TIERS.forEach(function (t) {
        bar.appendChild(makeTierButton(t.id, t.shortLabel));
      });
    });

    TIERS.forEach(function (tier) {
      var tierItems = FRAGMENTS.filter(function (f) { return f.tier === tier.id; });

      var navGroup = document.createElement('details');
      navGroup.className = 'sidebar-group';
      if (!tier.collapsed) navGroup.open = true;
      var navHead = document.createElement('summary');
      navHead.className = 'sidebar-group-head';
      navHead.innerHTML = '<span>' + tier.shortLabel + '</span><span class="sidebar-group-meta"><span class="count-num">' + tierItems.length + '</span><span class="sidebar-chevron" aria-hidden="true">&#8250;</span></span>';
      navGroup.appendChild(navHead);
      var navLinks = document.createElement('div');
      navLinks.className = 'sidebar-group-links';
      navGroup.appendChild(navLinks);

      var container;
      var list = document.createElement('div');
      list.className = 'specimen-list';

      if (tier.collapsed) {
        var details = document.createElement('details');
        details.className = 'legacy-drawer';
        details.id = 'tier-' + tier.id;
        var summary = document.createElement('summary');
        summary.innerHTML = '<div><h2 class="legacy-heading">' +
          tier.label + '</h2><p class="tier-summary">' + tier.summary + '</p></div><span class="ctl-btn">Show ' + tierItems.length + ' items</span>';
        details.appendChild(summary);
        details.appendChild(list);
        details.addEventListener('toggle', function () {
          var badge = summary.querySelector('.ctl-btn');
          if (badge) badge.textContent = details.open ? 'Hide ' + tierItems.length + ' items' : 'Show ' + tierItems.length + ' items';
          if (details.open) {
            cardRecords.forEach(function (rec) {
              if (rec.meta.tier === tier.id && !rec.card.classList.contains('hidden-item')) loadFragment(rec);
            });
          }
        });
        container = details;
      } else {
        var sec = document.createElement('section');
        sec.className = 'tier-section';
        sec.id = 'tier-' + tier.id;
        var head = document.createElement('div');
        head.className = 'tier-header';
        head.innerHTML = '<div><h2>' + tier.label + '</h2><p class="tier-summary">' + tier.summary + '</p></div><span class="count-num">' + tierItems.length + ' specimens</span>';
        sec.appendChild(head);
        sec.appendChild(list);
        container = sec;
      }

      mainHost.insertBefore(container, emptyState);
      sectionNodes[tier.id] = { container: container, navGroup: navGroup, tier: tier };

      tierItems.forEach(function (f) {
        var id = f.file.replace('.html', '');
        var card = document.createElement('article');
        card.className = 'fragment-section';
        card.id = 'frag-' + id;

        var head = document.createElement('div');
        head.className = 'specimen-head';

        var titles = document.createElement('div');
        titles.className = 'specimen-titles';

        var titleRow = document.createElement('div');
        titleRow.className = 'specimen-title-row';

        var h3 = document.createElement('h3');
        h3.className = 'fragment-label';
        var anchor = document.createElement('a');
        anchor.href = '#frag-' + id;
        anchor.textContent = f.label;
        h3.appendChild(anchor);

        var fileBadge = document.createElement('span');
        fileBadge.className = 'fragment-file';
        fileBadge.textContent = f.file;

        titleRow.append(h3, fileBadge);
        if (f.note) {
          var noteEl = document.createElement('span');
          noteEl.className = 'fragment-note';
          noteEl.textContent = f.note;
          titleRow.appendChild(noteEl);
        }

        var desc = document.createElement('p');
        desc.className = 'fragment-desc';
        desc.textContent = f.desc;

        titles.append(titleRow, desc);
        head.appendChild(titles);

        var frame = document.createElement('div');
        frame.className = 'fragment-frame' +
          (f.glass ? ' glass-stage' : '') +
          (f.stageSpecimen ? ' stage-specimen' : '') +
          (f.frame ? ' layout-frame' : '');

        var viewport = null;
        var openLink = null;
        if (f.frame) {
          var controls = document.createElement('div');
          controls.className = 'specimen-controls';

          viewport = document.createElement('div');
          viewport.className = 'layout-viewport';
          viewport.dataset.width = '1440';
          viewport.textContent = 'Loading layout preview...';
          frame.appendChild(viewport);

          ['1440', '1024', '390'].forEach(function (w) {
            var vpBtn = document.createElement('button');
            vpBtn.type = 'button';
            vpBtn.className = 'ctl-btn';
            vpBtn.textContent = w + 'px';
            vpBtn.setAttribute('aria-pressed', w === '1440' ? 'true' : 'false');
            vpBtn.addEventListener('click', function () {
              viewport.dataset.width = w;
              controls.querySelectorAll('[data-vp]').forEach(function (b) {
                b.setAttribute('aria-pressed', b === vpBtn ? 'true' : 'false');
              });
              requestAnimationFrame(function () { applyViewportScale(viewport); });
            });
            vpBtn.dataset.vp = w;
            controls.appendChild(vpBtn);
          });

          openLink = document.createElement('a');
          openLink.className = 'ctl-btn';
          openLink.textContent = 'Open isolated';
          openLink.target = '_blank';
          openLink.rel = 'noopener';
          openLink.href = f.file;
          controls.appendChild(openLink);
          head.appendChild(controls);
        }

        if (f.orbitalControls) {
          var orbControls = document.createElement('div');
          orbControls.className = 'specimen-controls';
          orbControls.setAttribute('role', 'group');
          orbControls.setAttribute('aria-label', 'Orbital agentic state modulation');
          ['start', 'send', 'waiting', 'streaming', 'finish', 'failure'].forEach(function (st) {
            var stBtn = document.createElement('button');
            stBtn.type = 'button';
            stBtn.className = 'ctl-btn';
            stBtn.textContent = st;
            stBtn.setAttribute('aria-pressed', st === 'start' ? 'true' : 'false');
            stBtn.addEventListener('click', function () {
              var hostEl = frame.querySelector('vi-orbital-field');
              if (hostEl) {
                hostEl.setAttribute('data-motion', 'running');
                hostEl.setAttribute('data-agent-state', st);
              }
              orbControls.querySelectorAll('[data-orb-state]').forEach(function (b) {
                b.setAttribute('aria-pressed', b === stBtn ? 'true' : 'false');
              });
            });
            stBtn.dataset.orbState = st;
            orbControls.appendChild(stBtn);
          });
          head.appendChild(orbControls);
        }

        card.append(head, frame);
        list.appendChild(card);

        var link = document.createElement('a');
        link.className = 'sidebar-link';
        link.href = '#frag-' + id;
        link.innerHTML = '<span>' + f.label + '</span>';
        link.addEventListener('click', function () {
          if (tier.collapsed) container.open = true;
          loadFragment(record);
        });
        navLinks.appendChild(link);

        var record = {
          meta: f,
          card: card,
          frame: frame,
          viewport: viewport,
          openLink: typeof openLink !== 'undefined' ? openLink : null,
          link: link,
          loaded: false,
          haystack: (f.label + ' ' + f.file + ' ' + f.desc + ' ' + (f.note || '') + ' ' + f.tier).toLowerCase()
        };
        card._record = record;
        cardRecords.push(record);

        if (!tier.collapsed) {
          if (observer && f.frame) {
            observer.observe(card);
          } else {
            loadFragment(record);
          }
        }
      });

      sidebarIndex.appendChild(navGroup);
    });

    function applyFilters() {
      var q = state.query.trim().toLowerCase();
      var visibleTotal = 0;
      var tierCounts = {};

      document.querySelectorAll('[data-tier]').forEach(function (btn) {
        btn.setAttribute('aria-pressed', btn.dataset.tier === state.tier ? 'true' : 'false');
      });

      cardRecords.forEach(function (rec) {
        var tierMatch = state.tier === 'all' || rec.meta.tier === state.tier;
        var queryMatch = !q || rec.haystack.indexOf(q) !== -1;
        var show = tierMatch && queryMatch;
        rec.card.classList.toggle('hidden-item', !show);
        rec.link.classList.toggle('hidden-item', !show);
        if (show) {
          visibleTotal += 1;
          tierCounts[rec.meta.tier] = (tierCounts[rec.meta.tier] || 0) + 1;
          if ((state.tier === 'legacy' || q) && rec.meta.tier === 'legacy') {
            sectionNodes.legacy.container.open = true;
            loadFragment(rec);
          }
        }
      });

      TIERS.forEach(function (t) {
        var count = tierCounts[t.id] || 0;
        var showTier = count > 0;
        sectionNodes[t.id].container.classList.toggle('hidden-item', !showTier);
        sectionNodes[t.id].navGroup.classList.toggle('hidden-item', !showTier);
        if (q && showTier) {
          sectionNodes[t.id].navGroup.open = true;
        } else if (!q) {
          sectionNodes[t.id].navGroup.open = !t.collapsed || state.tier === t.id;
        }
      });

      countEl.textContent = 'Showing ' + visibleTotal + ' of ' + FRAGMENTS.length + ' specimens';
      emptyState.classList.toggle('visible', visibleTotal === 0);
    }

    var searchDesktop = document.getElementById('catalog-search');
    var searchMobile = document.getElementById('mobile-search');
    function onSearch(val) {
      state.query = val;
      if (searchDesktop.value !== val) searchDesktop.value = val;
      if (searchMobile.value !== val) searchMobile.value = val;
      applyFilters();
    }
    searchDesktop.addEventListener('input', function (e) { onSearch(e.target.value); });
    searchMobile.addEventListener('input', function (e) { onSearch(e.target.value); });

    document.getElementById('reset-filters').addEventListener('click', function () {
      state.tier = 'all';
      onSearch('');
    });

    var themeBtn = document.getElementById('toggle-theme');
    themeBtn.addEventListener('click', function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      themeBtn.setAttribute('aria-pressed', state.theme === 'light' ? 'true' : 'false');
      themeBtn.textContent = 'Theme: ' + state.theme;
      syncIframes();
    });

    var motionBtn = document.getElementById('toggle-motion');
    motionBtn.addEventListener('click', function () {
      state.motionPaused = !state.motionPaused;
      document.documentElement.setAttribute('data-motion', state.motionPaused ? 'paused' : 'running');
      motionBtn.setAttribute('aria-pressed', state.motionPaused ? 'true' : 'false');
      motionBtn.textContent = state.motionPaused ? 'Motion: paused' : 'Motion: playing';
      syncIframes();
    });

    var tintBtn = document.getElementById('toggle-tint');
    tintBtn.addEventListener('click', function () {
      state.glassTint = !state.glassTint;
      document.body.classList.toggle('show-glass-tint', state.glassTint);
      tintBtn.setAttribute('aria-pressed', state.glassTint ? 'true' : 'false');
      tintBtn.textContent = state.glassTint ? 'Glass tint: on' : 'Glass tint: off';
    });

    applyFilters();
  </script>
</body>
</html>
